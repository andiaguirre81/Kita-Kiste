<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KitaKiste</title><meta name="theme-color" content="#8bb8a8"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#25332e;--muted:#6e7b76;--line:#e5ded2;--green:#8bb8a8}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1000px;margin:auto;padding:14px 14px 95px}.top{display:flex;align-items:center;gap:11px;padding:5px 0 14px}.logo{width:46px;height:46px;border-radius:15px;background:var(--green);display:grid;place-items:center;font-size:25px}.top h1{margin:0;font-size:1.35rem}.top small{color:var(--muted)}.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}.hero h2{font-size:1.75rem;line-height:1.08;margin:0 0 8px}.hero p{margin:0;color:var(--muted)}.search{width:100%;margin-top:15px;padding:14px 15px;border:1px solid var(--line);border-radius:15px;font-size:16px;background:white}.quick{display:flex;gap:8px;overflow:auto;padding:12px 0 2px}.quick button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 12px;color:var(--ink)}.quick button.active{background:var(--ink);color:white}.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}.filters select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;font-size:15px}.head{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px}.head h3{margin:0}.head span{font-size:.85rem;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}.cover{height:92px;background:linear-gradient(135deg,#dfece7,#f8e5d7);display:flex;align-items:end;padding:13px;font-size:2.5rem}.body{padding:13px}.body h4{margin:0 0 6px;font-size:1rem}.body p{font-size:.86rem;line-height:1.4;color:var(--muted);margin:0}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{font-size:.7rem;background:#f0eee7;border-radius:99px;padding:5px 7px}.actions{display:flex;gap:6px}.actions button{border:1px solid var(--line);background:white;border-radius:11px;padding:8px 10px}.actions .open{flex:1}.fab{position:fixed;right:18px;bottom:20px;border:0;background:var(--ink);color:white;border-radius:999px;padding:14px 18px;font-weight:700;box-shadow:0 10px 30px #0003}dialog{border:0;border-radius:24px;width:min(620px,calc(100% - 24px));padding:0;background:var(--card)}dialog::backdrop{background:#0006}.modal{padding:20px}.close{float:right;border:0;background:#eee8dd;border-radius:50%;width:38px;height:38px}.modal h2{margin:5px 0}.modal p{line-height:1.55}.field{margin:10px 0}.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit}.save{width:100%;padding:13px;border:0;border-radius:12px;background:var(--green);font-weight:700}.notice{font-size:.82rem;color:var(--muted);background:#f1eee7;padding:10px;border-radius:12px}@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(4,1fr)}}</style></head><body><main><div class="top"><div class="logo">🧺</div><div><h1>KitaKiste</h1><small>Ideen für den Kita-Alltag</small></div></div><section class="hero"><h2>Was passt gerade?</h2><p>Schnell eine Idee finden – nach Zeit, Alter, Ort und Vorbereitung.</p><input class="search" id="q" placeholder="Suchen: Bewegung, Karton, Sprache …"></section><div class="quick"><button data-q="5">⚡ 5 Minuten</button><button data-q="keine">🙌 Ohne Vorbereitung</button><button data-q="draußen">🌳 Draußen</button><button data-q="fav">♥ Favoriten</button><button id="random">🎲 Überrasch mich</button></div><div class="filters"><select id="age"><option value="">Alter: alle</option><option>U3</option><option>3–6</option><option>4–6</option></select><select id="cat"><option value="">Kategorie: alle</option></select><select id="prep"><option value="">Vorbereitung: alle</option><option>keine</option><option>wenig</option><option>mehr</option></select><select id="edu"><option value="">Bildungsbereich: alle</option></select></div><div class="head"><h3>Ideen</h3><span id="count"></span></div><section id="grid" class="grid"></section></main><button class="fab" id="add">＋ Eigene Idee</button><dialog id="detail"><div class="modal" id="detailBody"></div></dialog><dialog id="addDlg"><div class="modal"><button class="close" onclick="addDlg.close()">×</button><h2>Eigene Idee</h2><p class="notice">Im Prototyp wird deine Idee nur auf diesem Gerät gespeichert.</p><div class="field"><label>Titel</label><input id="ot"></div><div class="field"><label>Kurzbeschreibung</label><textarea id="od"></textarea></div><div class="field"><label>Material</label><input id="om"></div><div class="field"><label>Kategorie</label><input id="oc"></div><button class="save" id="save">Idee speichern</button></div></dialog><script>
let ideas=[],quick='',onlyFav=false;const $=x=>document.getElementById(x),favs=new Set(JSON.parse(localStorage.getItem('kkfav')||'[]')),own=JSON.parse(localStorage.getItem('kkown')||'[]');fetch('ideas.json').then(r=>r.json()).then(d=>{ideas=d.concat(own);setup();render()});function setup(){[...new Set(ideas.map(x=>x.category))].sort().forEach(x=>cat.add(new Option(x,x)));[...new Set(ideas.map(x=>x.education).filter(Boolean))].sort().forEach(x=>edu.add(new Option(x,x)))}function filtered(){let s=q.value.toLowerCase();return ideas.filter(x=>{if(s&&!JSON.stringify(x).toLowerCase().includes(s))return false;if(age.value&&!x.age.includes(age.value==='3–6'?'3':age.value))return false;if(cat.value&&x.category!==cat.value)return false;if(prep.value&&x.prep!==prep.value)return false;if(edu.value&&x.education!==edu.value)return false;if(onlyFav&&!favs.has(String(x.id)))return false;if(quick==='5'&&x.duration!=='5')return false;if(quick==='keine'&&x.prep!=='keine')return false;if(quick==='draußen'&&!x.place.includes('draußen'))return false;return true})}function render(){let a=filtered();count.textContent=a.length+' Treffer';grid.innerHTML=a.map(x=>`<article class=card><div class=cover>${x.icon||'💡'}</div><div class=body><h4>${x.title}</h4><div class=tags><span class=tag>${x.age}</span><span class=tag>${x.duration} Min.</span><span class=tag>${x.prep}</span></div><p>${x.description}</p><div class=actions><button class=open onclick="openIdea('${x.id}')">Ansehen</button><button onclick="fav('${x.id}')">${favs.has(String(x.id))?'♥':'♡'}</button></div></div></article>`).join('')||'<p>Keine passende Idee gefunden.</p>'}function openIdea(id){let x=ideas.find(y=>String(y.id)===String(id));detailBody.innerHTML=`<button class=close onclick="detail.close()">×</button><div style="font-size:3rem">${x.icon||'💡'}</div><h2>${x.title}</h2><div class=tags><span class=tag>${x.age}</span><span class=tag>${x.group} Kinder</span><span class=tag>${x.duration} Min.</span></div><h4>Darum geht’s</h4><p>${x.description}</p><h4>Material</h4><p>${x.materials}</p><h4>Bildungsbereich</h4><p>${x.education||'Eigene Idee'}</p>`;detail.showModal()}function fav(id){id=String(id);favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('kkfav',JSON.stringify([...favs]));render()}['q','age','cat','prep','edu'].forEach(x=>$(x).addEventListener(x==='q'?'input':'change',render));document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let v=b.dataset.q;if(v==='fav')onlyFav=!onlyFav;else quick=quick===v?'':v;document.querySelectorAll('[data-q]').forEach(z=>z.classList.remove('active'));if((v==='fav'&&onlyFav)||(v!=='fav'&&quick===v))b.classList.add('active');render()});random.onclick=()=>{let a=filtered();if(a.length)openIdea(a[Math.floor(Math.random()*a.length)].id)};add.onclick=()=>addDlg.showModal();save.onclick=()=>{if(!ot.value.trim())return;let a=JSON.parse(localStorage.getItem('kkown')||'[]');a.push({id:'own-'+Date.now(),title:ot.value.trim(),icon:'💡',category:oc.value.trim()||'Eigene Ideen',age:'3–6',group:'variabel',duration:'15',place:['drinnen','draußen'],prep:'wenig',materials:om.value.trim()||'nach Bedarf',description:od.value.trim()||'Eigene Spielidee',education:''});localStorage.setItem('kkown',JSON.stringify(a));location.reload()};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');</script></body></html>
