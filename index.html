<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KitaKiste</title>
<meta name="theme-color" content="#8bb8a8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#25332e;--muted:#6e7b76;--line:#e5ded2;--green:#8bb8a8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:1000px;margin:auto;padding:14px 14px 95px}
.top{display:flex;align-items:center;gap:11px;padding:5px 0 14px}
.logo{width:46px;height:46px;border-radius:15px;background:var(--green);display:grid;place-items:center;font-size:25px}
.top h1{margin:0;font-size:1.35rem} .top small{color:var(--muted)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px}
.hero h2{font-size:1.75rem;line-height:1.08;margin:0 0 8px} .hero p{margin:0;color:var(--muted)}
.search{width:100%;margin-top:15px;padding:14px 15px;border:1px solid var(--line);border-radius:15px;font-size:16px;background:white}
.quick{display:flex;gap:8px;overflow:auto;padding:12px 0 2px}
.quick button{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 12px;color:var(--ink)}
.quick button.active{background:var(--ink);color:white}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.filters select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:white;font-size:15px}
.head{display:flex;justify-content:space-between;align-items:end;margin:20px 2px 10px} .head h3{margin:0} .head span{font-size:.85rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cover{height:92px;background:linear-gradient(135deg,#dfece7,#f8e5d7);display:flex;align-items:end;padding:13px;font-size:2.5rem}
.body{padding:13px} .body h4{margin:0 0 6px;font-size:1rem} .body p{font-size:.86rem;line-height:1.4;color:var(--muted);margin:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0} .tag{font-size:.7rem;background:#f0eee7;border-radius:99px;padding:5px 7px}
.actions{display:flex;gap:6px} .actions button{border:1px solid var(--line);background:white;border-radius:11px;padding:8px 10px} .actions .open{flex:1}
.fab{position:fixed;right:18px;bottom:20px;border:0;background:var(--ink);color:white;border-radius:999px;padding:14px 18px;font-weight:700;box-shadow:0 10px 30px #0003}
dialog{border:0;border-radius:24px;width:min(620px,calc(100% - 24px));padding:0;background:var(--card)} dialog::backdrop{background:#0006}
.modal{padding:20px} .close{float:right;border:0;background:#eee8dd;border-radius:50%;width:38px;height:38px}
.modal h2{margin:5px 0} .modal p{line-height:1.55}
.field{margin:10px 0} .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:11px;font:inherit}
.save{width:100%;padding:13px;border:0;border-radius:12px;background:var(--green);font-weight:700}
.notice{font-size:.82rem;color:var(--muted);background:#f1eee7;padding:10px;border-radius:12px}
.credits{text-align:center;color:var(--muted);font-size:.78rem;line-height:1.5;margin:28px 0 6px}.credits strong{color:var(--ink);font-weight:600}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<main>
<div class="top"><div class="logo">🧺</div><div><h1>KitaKiste</h1><small>Ideen für den Kita-Alltag</small></div></div>

<section class="hero">
<h2>Was passt gerade?</h2>
<p>Schnell eine Idee finden – nach Zeit, Alter, Ort und Vorbereitung.</p>
<input class="search" id="searchInput" placeholder="Suchen: Bewegung, Karton, Sprache …">
</section>

<div class="quick">
<button data-quick="5">⚡ 5 Minuten</button>
<button data-quick="keine">🙌 Ohne Vorbereitung</button>
<button data-quick="draußen">🌳 Draußen</button>
<button data-quick="fav">♥ Favoriten</button>
<button id="randomBtn">🎲 Überrasch mich</button>
</div>

<div class="filters">
<select id="ageFilter">
<option value="">Alter: alle</option>
<option value="U3">U3</option>
<option value="3-4">3–4 Jahre</option>
<option value="4-6">4–6 Jahre</option>
<option value="Vorschule">Vorschule</option>
</select>

<select id="categoryFilter"><option value="">Kategorie: alle</option></select>

<select id="prepFilter">
<option value="">Vorbereitung: alle</option>
<option value="keine">Keine</option>
<option value="wenig">Wenig</option>
<option value="mehr">Mehr</option>
</select>

<select id="educationFilter"><option value="">Bildungsbereich: alle</option></select>
</div>

<div class="head"><h3>Ideen</h3><span id="countLabel"></span></div>
<section id="grid" class="grid"></section>
<footer class="credits"><strong>KitaKiste</strong><br>Idee &amp; Entwicklung: Andreas Aguirre<br>© 2026 Andreas Aguirre</footer>
</main>

<button class="fab" id="addBtn">＋ Eigene Idee</button>

<dialog id="detailDialog"><div class="modal" id="detailBody"></div></dialog>

<dialog id="addDialog">
<div class="modal">
<button class="close" id="closeAdd">×</button>
<h2>Eigene Idee</h2>
<p class="notice">Im Prototyp wird deine Idee nur auf diesem Gerät gespeichert.</p>
<div class="field"><label>Titel</label><input id="ownTitle"></div>
<div class="field"><label>Kurzbeschreibung</label><textarea id="ownDesc"></textarea></div>
<div class="field"><label>Material</label><input id="ownMaterial"></div>
<div class="field"><label>Kategorie</label><input id="ownCategory"></div>
<button class="save" id="saveOwn">Idee speichern</button>
</div>
</dialog>

<script>
const baseIdeas = [{"id": 1, "title": "Inselweg", "icon": "🐊", "category": "Bewegung", "age": "4–6", "group": "5–15", "duration": "15", "place": ["drinnen", "draußen", "turnhalle"], "prep": "keine", "materials": "Reifen, Matten oder Zeitungen", "description": "Die Gruppe baut aus wenigen Inseln einen Weg und versucht gemeinsam, das andere Ufer zu erreichen.", "education": "Bewegung"}, {"id": 2, "title": "Geräusche-Detektive", "icon": "👂", "category": "Wahrnehmung", "age": "3–6", "group": "2–15", "duration": "5", "place": ["drinnen", "draußen"], "prep": "keine", "materials": "kein Material", "description": "Eine Minute bewusst lauschen. Danach werden Geräusche gesammelt, beschrieben und nach nah, fern, laut oder leise sortiert.", "education": "Körper, Gesundheit und Ernährung"}, {"id": 3, "title": "Kartonstadt", "icon": "📦", "category": "Bauen", "age": "3–6", "group": "3–20", "duration": "30+", "place": ["drinnen"], "prep": "wenig", "materials": "Kartons, Klebeband, Stifte", "description": "Aus Kartons entstehen Häuser, Wege und Fantasieorte. Anschließend wird die Stadt gemeinsam bespielt und weitergebaut.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 4, "title": "Farben-Safari", "icon": "🌈", "category": "Bewegung", "age": "U3–6", "group": "3–20", "duration": "10", "place": ["drinnen", "draußen"], "prep": "keine", "materials": "kein Material", "description": "Eine Farbe wird genannt. Die Kinder entdecken passende Dinge in ihrer Umgebung und bestimmen anschließend selbst die nächste Farbe.", "education": "Bewegung"}, {"id": 5, "title": "Papprollen-Kugelbahn", "icon": "🌀", "category": "Bauen", "age": "4–6", "group": "1–8", "duration": "30", "place": ["drinnen"], "prep": "wenig", "materials": "Papprollen, Klebeband, große Kugeln", "description": "Eine Kugelbahn planen, befestigen, testen und so verändern, dass die Kugel möglichst weit rollt.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 6, "title": "Sprudelgas-Ballon", "icon": "🎈", "category": "Forschen", "age": "4–6", "group": "1–6", "duration": "15", "place": ["drinnen", "draußen"], "prep": "wenig", "materials": "PET-Flasche, Essig, Backpulver, Luftballon", "description": "Beobachten, wie bei der Mischung von Essig und Backpulver Gas entsteht und einen Ballon füllt. Nur begleitet durchführen.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 7, "title": "Was schwimmt?", "icon": "💧", "category": "Forschen", "age": "3–6", "group": "1–8", "duration": "20", "place": ["drinnen", "draußen"], "prep": "wenig", "materials": "Wasserschale, verschiedene Gegenstände", "description": "Vor dem Test vermuten die Kinder, was schwimmt oder sinkt. Danach wird ausprobiert, verglichen und erneut gefragt.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 8, "title": "Mini-Fallschirm", "icon": "🪂", "category": "Forschen", "age": "4–6", "group": "1–6", "duration": "30", "place": ["drinnen", "draußen"], "prep": "mehr", "materials": "leichte Folie, Schnur, Knete oder Spielfigur", "description": "Einen kleinen Fallschirm bauen, fallen lassen und durch Veränderungen an Größe oder Gewicht weiter erforschen.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 9, "title": "Wasserberg", "icon": "🪙", "category": "Forschen", "age": "4–6", "group": "1–6", "duration": "15", "place": ["drinnen"], "prep": "wenig", "materials": "Münzen, Pipette, Wasser", "description": "Tropfen langsam auf eine Münze geben, zählen und beobachten, wie sich das Wasser über die Oberfläche wölbt.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 10, "title": "Magnet-Detektive", "icon": "🧲", "category": "Forschen", "age": "4–6", "group": "1–8", "duration": "15", "place": ["drinnen"], "prep": "wenig", "materials": "kindgerechte Magnete, verschiedene Gegenstände", "description": "Erst vermuten, dann testen: Welche Materialien werden angezogen? Ergebnisse gemeinsam sortieren und neue Fragen entwickeln.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 11, "title": "Flaschen-Tornado", "icon": "🌪️", "category": "Forschen", "age": "4–6", "group": "1–6", "duration": "20", "place": ["drinnen", "draußen"], "prep": "mehr", "materials": "2 feste PET-Flaschen, Wasser, passender Tornado-Adapter", "description": "Zwei Flaschen verbinden und ausprobieren, wie das Wasser von einer in die andere gelangt. Durch kreisende Bewegung entsteht ein Wirbel.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 12, "title": "Farben wandern im Zucker", "icon": "🟪", "category": "Forschen", "age": "4–6", "group": "1–6", "duration": "20", "place": ["drinnen"], "prep": "wenig", "materials": "Zuckerwürfel, Wasser, Lebensmittelfarbe, Pipetten, Teller", "description": "Gefärbtes Wasser auf getrennte Zuckerwürfel tropfen und beobachten, wie sich Flüssigkeit und Farben ausbreiten und begegnen.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 13, "title": "Tier-Orchester", "icon": "🎵", "category": "Musik", "age": "U3–6", "group": "3–20", "duration": "15", "place": ["drinnen"], "prep": "keine", "materials": "optional Instrumente", "description": "Tieren werden Klänge oder Bewegungen zugeordnet. Ein Kind dirigiert, welche Tiere gerade zu hören oder zu sehen sind.", "education": "Musisch-ästhetische Bildung"}, {"id": 14, "title": "Natur-Mandala", "icon": "🍂", "category": "Natur", "age": "3–6", "group": "1–15", "duration": "20", "place": ["draußen"], "prep": "keine", "materials": "Blätter, Steine, Stöcke", "description": "Naturmaterialien sammeln und daraus gemeinsam Muster oder freie Bodenbilder gestalten.", "education": "Ökologische Bildung"}, {"id": 15, "title": "Gemeinschaftsinseln", "icon": "📰", "category": "Kooperation", "age": "3–6", "group": "5–20", "duration": "15", "place": ["drinnen", "turnhalle"], "prep": "wenig", "materials": "Matten oder Zeitungen", "description": "Auf ein Signal finden alle auf den vorhandenen Inseln Platz. Die Inseln werden weniger, aber niemand scheidet aus.", "education": "Soziale und (inter-)kulturelle Bildung"}, {"id": 16, "title": "Riesengemälde", "icon": "🖼️", "category": "Kreativ", "age": "U3–6", "group": "3–20", "duration": "30", "place": ["drinnen", "draußen"], "prep": "wenig", "materials": "großes Papier, Farbe, Rollen, Schwämme", "description": "Eine große Fläche wird gemeinsam mit unterschiedlichen Werkzeugen, Bewegungen und Spuren gestaltet.", "education": "Musisch-ästhetische Bildung"}, {"id": 17, "title": "Ballon gemeinsam oben halten", "icon": "🎈", "category": "Bewegung", "age": "U3–4", "group": "1–8", "duration": "5", "place": ["drinnen"], "prep": "keine", "materials": "Ballon", "description": "Einen Ballon gemeinsam möglichst lange in Bewegung halten. Das Spiel funktioniert auch im Sitzen.", "education": "Bewegung"}, {"id": 18, "title": "Fühlbeutel", "icon": "👜", "category": "Wahrnehmung", "age": "U3–6", "group": "1–8", "duration": "10", "place": ["drinnen"], "prep": "wenig", "materials": "Stoffbeutel, ungefährliche Alltagsgegenstände", "description": "Gegenstände ertasten, beschreiben, zuordnen oder durch Zeigen und Bildkarten wiedererkennen.", "education": "Körper, Gesundheit und Ernährung"}, {"id": 19, "title": "Wäscheklammer-Werkstatt", "icon": "🧷", "category": "Feinmotorik", "age": "3–6", "group": "1–6", "duration": "10", "place": ["drinnen"], "prep": "wenig", "materials": "Wäscheklammern, Schalen, Karton", "description": "Klammern sortieren, an Kartonränder stecken und kleine Muster oder Transportaufgaben erfinden.", "education": "Körper, Gesundheit und Ernährung"}, {"id": 20, "title": "Becher-Baumeister", "icon": "🥤", "category": "Bauen", "age": "3–6", "group": "1–8", "duration": "15", "place": ["drinnen"], "prep": "wenig", "materials": "stabile Becher", "description": "Hohe, breite oder besonders stabile Bauwerke ausprobieren und gemeinsam herausfinden, wodurch sie stehen bleiben.", "education": "Mathematische Bildung"}, {"id": 21, "title": "Schatten-Zeitreise", "icon": "☀️", "category": "Forschen", "age": "4–6", "group": "1–10", "duration": "15", "place": ["draußen"], "prep": "keine", "materials": "Kreide optional", "description": "Schatten entdecken und markieren. Später am Tag prüfen, was sich an Richtung und Länge verändert hat.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 22, "title": "Papierbrücke", "icon": "🌉", "category": "Bauen", "age": "4–6", "group": "1–6", "duration": "20", "place": ["drinnen"], "prep": "wenig", "materials": "Papier, zwei Bausteine, Spielfiguren", "description": "Papier zwischen zwei Auflagen legen und durch Falten, Rollen oder mehrere Schichten tragfähiger machen.", "education": "Naturwissenschaftlich-technische Bildung"}, {"id": 23, "title": "Klangpaare", "icon": "🔔", "category": "Musik", "age": "3–6", "group": "1–8", "duration": "20", "place": ["drinnen"], "prep": "mehr", "materials": "gleiche blickdichte Dosen, unterschiedliche Füllungen", "description": "Je zwei Dosen gleich füllen und passende Klangpaare nur durch Hören finden.", "education": "Musisch-ästhetische Bildung"}, {"id": 24, "title": "Silben-Sprünge", "icon": "🦘", "category": "Sprache", "age": "4–6", "group": "2–12", "duration": "10", "place": ["drinnen", "draußen"], "prep": "keine", "materials": "kein Material", "description": "Namen und Begriffe in Silben sprechen und jede Silbe mit einer Bewegung begleiten.", "education": "Sprache und Kommunikation"}, {"id": 25, "title": "Reimlabor", "icon": "🔎", "category": "Sprache", "age": "4–6", "group": "2–12", "duration": "10", "place": ["drinnen"], "prep": "keine", "materials": "kein Material", "description": "Zu einfachen Wörtern echte oder erfundene Reimwörter suchen. Quatschwörter sind ausdrücklich erlaubt.", "education": "Sprache und Kommunikation"}, {"id": 26, "title": "Drei-Dinge-Geschichte", "icon": "💭", "category": "Sprache", "age": "3–6", "group": "2–10", "duration": "15", "place": ["drinnen"], "prep": "wenig", "materials": "3–5 beliebige Gegenstände", "description": "Einige Gegenstände auswählen und gemeinsam eine Geschichte erfinden, in der alle vorkommen.", "education": "Sprache und Kommunikation"}, {"id": 27, "title": "Formen-Safari", "icon": "🔺", "category": "Mathe", "age": "3–6", "group": "1–12", "duration": "15", "place": ["drinnen", "draußen"], "prep": "keine", "materials": "kein Material", "description": "Kreise, Dreiecke und Vierecke in der Umgebung suchen, zeigen und miteinander vergleichen.", "education": "Mathematische Bildung"}, {"id": 28, "title": "Musterstraße", "icon": "🟡", "category": "Mathe", "age": "3–6", "group": "1–8", "duration": "15", "place": ["drinnen"], "prep": "wenig", "materials": "Bausteine, Deckel oder Naturmaterial", "description": "Einfache Reihenfolgen legen, beschreiben und von anderen Kindern fortsetzen lassen.", "education": "Mathematische Bildung"}, {"id": 29, "title": "Sortierlabor", "icon": "🧺", "category": "Mathe", "age": "U3–6", "group": "1–6", "duration": "10", "place": ["drinnen"], "prep": "wenig", "materials": "große Deckel, Bausteine oder Naturmaterial", "description": "Nach Farbe, Form oder Größe sortieren – oder eine eigene Sortierregel erfinden und erklären.", "education": "Mathematische Bildung"}, {"id": 30, "title": "Gefühls-Stopp", "icon": "😀", "category": "Gefühle", "age": "3–6", "group": "3–20", "duration": "15", "place": ["drinnen", "turnhalle"], "prep": "wenig", "materials": "Musik", "description": "Zur Musik bewegen. Beim Stopp wird ein Gefühl genannt und mit Gesicht, Körperhaltung oder Bewegung dargestellt.", "education": "Soziale und (inter-)kulturelle Bildung"}, {"id": 31, "title": "Gemeinsam bis zehn", "icon": "🤝", "category": "Kooperation", "age": "4–6", "group": "4–20", "duration": "10", "place": ["drinnen"], "prep": "keine", "materials": "kein Material", "description": "Die Gruppe zählt gemeinsam, ohne Reihenfolge festzulegen. Sprechen zwei gleichzeitig, beginnt die Gruppe entspannt neu.", "education": "Soziale und (inter-)kulturelle Bildung"}, {"id": 32, "title": "Stärken-Ball", raußen"], "prep": "keine", "materials": "kein Material", "description": "Eine Person klatscht einen kurzen Rhythmus, die Gruppe antwortet als Echo. Danach wechselt die Leitung.", "education": "Musisch-ästhetische Bildung"}, {"id": 60, "title": "Gefühls-Wetter", "icon": "🌤️", "category": "Gefühle", "age": "3–6", "group": "2–15", "duration": "10", "place": ["drinnen"], "prep": "wenig", "materials": "optional Wetterbilder", "description": "Die eigene Stimmung als Wetter beschreiben oder zeigen: sonnig, windig, neblig, regnerisch – ohne Begründungszwang.", "education": "Soziale und (inter-)kulturelle Bildung"}];
const ownIdeas = JSON.parse(localStorage.getItem('kkown') || '[]');
const ideas = baseIdeas.concat(ownIdeas);

const searchInput = document.getElementById('searchInput');
const ageFilter = document.getElementById('ageFilter');
const categoryFilter = document.getElementById('categoryFilter');
const prepFilter = document.getElementById('prepFilter');
const educationFilter = document.getElementById('educationFilter');
const grid = document.getElementById('grid');
const countLabel = document.getElementById('countLabel');
const randomBtn = document.getElementById('randomBtn');
const addBtn = document.getElementById('addBtn');
const detailDialog = document.getElementById('detailDialog');
const detailBody = document.getElementById('detailBody');
const addDialog = document.getElementById('addDialog');

let quickFilter = '';
let favoritesOnly = false;
const favorites = new Set(JSON.parse(localStorage.getItem('kkfav') || '[]').map(String));

function addOptions() {
  [...new Set(ideas.map(i => i.category).filter(Boolean))].sort()
    .forEach(v => categoryFilter.add(new Option(v, v)));
  [...new Set(ideas.map(i => i.education).filter(Boolean))].sort()
    .forEach(v => educationFilter.add(new Option(v, v)));
}

function matchesAge(ageText, wanted) {
  if (!wanted) return true;
  const a = String(ageText || '').toLowerCase();

  if (wanted === 'U3') return a.includes('u3');
  if (wanted === '3-4') return a.includes('3') || a.includes('u3–4') || a.includes('u3-4');
  if (wanted === '4-6') return a.includes('4') || a.includes('5') || a.includes('6');
  if (wanted === 'Vorschule') return a.includes('vorschule') || a.includes('4–6') || a.includes('4-6');
  return true;
}

function getFilteredIdeas() {
  const query = searchInput.value.trim().toLowerCase();
  return ideas.filter(i => {
    const searchable = [
      i.title, i.category, i.age, i.group, i.duration, i.prep,
      i.materials, i.description, i.education, ...(i.place || [])
    ].join(' ').toLowerCase();

    if (query && !searchable.includes(query)) return false;
    if (!matchesAge(i.age, ageFilter.value)) return false;
    if (categoryFilter.value && i.category !== categoryFilter.value) return false;
    if (prepFilter.value && i.prep !== prepFilter.value) return false;
    if (educationFilter.value && i.education !== educationFilter.value) return false;
    if (favoritesOnly && !favorites.has(String(i.id))) return false;
    if (quickFilter === '5' && String(i.duration) !== '5') return false;
    if (quickFilter === 'keine' && i.prep !== 'keine') return false;
    if (quickFilter === 'draußen' && !(i.place || []).includes('draußen')) return false;

    return true;
  });
}

function render() {
  const list = getFilteredIdeas();
  countLabel.textContent = list.length + ' Treffer';

  if (!list.length) {
    grid.innerHTML = '<p>Keine passende Idee gefunden.</p>';
    return;
  }

  grid.innerHTML = list.map(i => `
    <article class="card">
      <div class="cover">${i.icon || '💡'}</div>
      <div class="body">
        <h4>${i.title}</h4>
        <div class="tags">
          <span class="tag">${i.age}</span>
          <span class="tag">${i.duration} Min.</span>
          <span class="tag">${i.prep}</span>
        </div>
        <p>${i.description}</p>
        <div class="actions">
          <button class="open" data-open="${i.id}">Ansehen</button>
          <button data-fav="${i.id}">${favorites.has(String(i.id)) ? '♥' : '♡'}</button>
        </div>
      </div>
    </article>
  `).join('');

  document.querySelectorAll('[data-open]').forEach(btn => {
    btn.addEventListener('click', () => openIdea(btn.dataset.open));
  });

  document.querySelectorAll('[data-fav]').forEach(btn => {
    btn.addEventListener('click', () => toggleFavorite(btn.dataset.fav));
  });
}

function openIdea(id) {
  const i = ideas.find(x => String(x.id) === String(id));
  if (!i) return;

  detailBody.innerHTML = `
    <button class="close" id="closeDetail">×</button>
    <div style="font-size:3rem">${i.icon || '💡'}</div>
    <h2>${i.title}</h2>
    <div class="tags">
      <span class="tag">${i.age}</span>
      <span class="tag">${i.group} Kinder</span>
      <span class="tag">${i.duration} Min.</span>
    </div>
    <h4>Darum geht’s</h4>
    <p>${i.description}</p>
    <h4>Material</h4>
    <p>${i.materials}</p>
    <h4>Bildungsbereich</h4>
    <p>${i.education || 'Eigene Idee'}</p>
  `;
  document.getElementById('closeDetail').addEventListener('click', () => detailDialog.close());
  detailDialog.showModal();
}

function toggleFavorite(id) {
  id = String(id);
  if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
  localStorage.setItem('kkfav', JSON.stringify([...favorites]));
  render();
}

[searchInput, ageFilter, categoryFilter, prepFilter, educationFilter].forEach(el => {
  el.addEventListener(el === searchInput ? 'input' : 'change', render);
});

document.querySelectorAll('[data-quick]').forEach(btn => {
  btn.addEventListener('click', () => {
    const value = btn.dataset.quick;

    if (value === 'fav') {
      favoritesOnly = !favoritesOnly;
    } else {
      quickFilter = quickFilter === value ? '' : value;
    }

    document.querySelectorAll('[data-quick]').forEach(b => b.classList.remove('active'));

    if (favoritesOnly) {
      const favBtn = document.querySelector('[data-quick="fav"]');
      if (favBtn) favBtn.classList.add('active');
    }
    if (quickFilter) {
      const qBtn = document.querySelector(`[data-quick="${quickFilter}"]`);
      if (qBtn) qBtn.classList.add('active');
    }

    render();
  });
});

randomBtn.addEventListener('click', () => {
  const list = getFilteredIdeas();
  if (!list.length) return;
  openIdea(list[Math.floor(Math.random() * list.length)].id);
});

addBtn.addEventListener('click', () => addDialog.showModal());
document.getElementById('closeAdd').addEventListener('click', () => addDialog.close());

document.getElementById('saveOwn').addEventListener('click', () => {
  const title = document.getElementById('ownTitle').value.trim();
  if (!title) return;

  const stored = JSON.parse(localStorage.getItem('kkown') || '[]');
  stored.push({
    id: 'own-' + Date.now(),
    title,
    icon:'💡',
    category:document.getElementById('ownCategory').value.trim() || 'Eigene Ideen',
    age:'3–6',
    group:'variabel',
    duration:'15',
    place:['drinnen','draußen'],
    prep:'wenig',
    materials:document.getElementById('ownMaterial').value.trim() || 'nach Bedarf',
    description:document.getElementById('ownDesc').value.trim() || 'Eigene Spielidee',
    education:''
  });
  localStorage.setItem('kkown', JSON.stringify(stored));
  location.reload();
});

addOptions();
render();
</script>
